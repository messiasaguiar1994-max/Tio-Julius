<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="icon" href="data:,">
<title>Tio Julius no Bairro</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000;
  }
  #palco { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); overflow: hidden; background: #1a1220; }
  body { font-family: 'Arial Black', 'Segoe UI', Arial, sans-serif; }
  #cena canvas { display: block; }
  #grao { position: absolute; inset: 0; z-index: 1; pointer-events: none; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(30,10,20,.22) 100%); mix-blend-mode: multiply; }
  #carregando { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #ffd38a; font-size: 22px; letter-spacing: 1px; background: #1a1220; z-index: 5; }
  /* balão: tamanhos proporcionais à largura do jogo (--u = 1% da largura) */
  #balao { --b: calc(var(--u) * .6); position: absolute; left: 0; top: 0; display: none; width: calc(var(--b) * 86); background: #fffaf0; border: calc(var(--b) * .9) solid #1b1b1b; border-radius: calc(var(--b) * 5); padding: calc(var(--b) * 3) calc(var(--b) * 3.6); box-shadow: calc(var(--b) * 1.2) calc(var(--b) * 1.2) 0 #1b1b1b; z-index: 3; will-change: transform; box-sizing: border-box; }
  #balao:after { content: ''; position: absolute; left: 50%; bottom: calc(var(--b) * -5.6); margin-left: calc(var(--b) * -3); border: calc(var(--b) * 3) solid transparent; border-top: calc(var(--b) * 4) solid #1b1b1b; }
  #balao.entra { animation: entra .35s cubic-bezier(.2,1.4,.4,1) both; }
  #balao.sai { animation: sai .3s ease-in both; }
  @keyframes entra { from { opacity: 0; scale: .6; } to { opacity: 1; scale: 1; } }
  @keyframes sai { to { opacity: 0; scale: .8; } }
  .b-topo { display: flex; align-items: center; gap: calc(var(--b) * 3); margin-bottom: calc(var(--b) * 2.4); }
  #b-foto { width: calc(var(--b) * 17); height: calc(var(--b) * 17); flex: none; border-radius: 50%; border: calc(var(--b) * .8) solid #f97316; object-fit: cover; background: #f59e0b; box-shadow: 0 0 0 calc(var(--b) * .6) #1b1b1b; }
  #b-nome { font-size: calc(var(--b) * 6.2); line-height: 1.1; color: #c2410c; word-break: break-word; }
  #b-perg { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 700; font-size: calc(var(--b) * 5.6); line-height: 1.22; color: #1b1b1b; }
  #b-resp { display: none; }
  /* placa do bairro */
  #placa { position: absolute; top: calc(var(--u) * 2.6); left: 50%; transform: translateX(-50%); background: #0f5132; color: #fff; border: calc(var(--u) * .55) solid #fff; border-radius: calc(var(--u) * 1.2); padding: calc(var(--u) * .8) calc(var(--u) * 2.6); font-size: calc(var(--u) * 3.6); letter-spacing: 1px; box-shadow: 0 3px 0 rgba(0,0,0,.4); z-index: 2; white-space: nowrap; }
  #status { position: absolute; bottom: calc(var(--u) * 2); left: calc(var(--u) * 2); color: #fff; font: 600 calc(var(--u) * 2.4) Arial; background: rgba(0,0,0,.55); padding: 5px 9px; border-radius: 8px; transition: opacity 1s; z-index: 4; }
  #status.ok { color: #86efac; }
  /* tela inicial */
  #inicio { position: fixed; inset: 0; z-index: 6; display: flex; align-items: center; justify-content: center; background: linear-gradient(#24205a, #7d4f8f 55%, #f08a5d); }
  .card { width: min(88vw, 420px); background: #fffaf0; border: 4px solid #1b1b1b; border-radius: 18px; padding: 22px; box-shadow: 8px 8px 0 #1b1b1b; font-family: 'Segoe UI', Arial, sans-serif; }
  .card h1 { font-family: 'Arial Black', Arial; margin: 0 0 4px; font-size: 26px; color: #c2410c; }
  .card p { margin: 0 0 16px; color: #444; }
  .card label { display: block; font-weight: 700; margin: 12px 0 4px; }
  .card small { color: #777; font-weight: 400; }
  .card input { width: 100%; box-sizing: border-box; font-size: 17px; padding: 10px; border: 3px solid #1b1b1b; border-radius: 10px; }
  .card button { width: 100%; margin-top: 16px; font: 800 18px 'Arial Black', Arial; padding: 12px; border: 3px solid #1b1b1b; border-radius: 12px; cursor: pointer; box-shadow: 4px 4px 0 #1b1b1b; }
  #btn-live { background: #f97316; color: #fff; }
  #btn-teste { background: #fde68a; color: #1b1b1b; }
</style>
</head>
<body>
<div id="palco">
<div id="cena"></div>
<div id="grao"></div>
<div id="placa">BAIRRO DO TIO JULIUS</div>
<div id="balao"><div class="b-topo"><img id="b-foto" alt=""><span id="b-nome"></span></div><div id="b-perg"></div><div id="b-resp"></div></div>
<div id="status"></div>
</div>
<div id="carregando">Carregando o bairro…</div>
<div id="inicio">
  <div class="card">
    <h1>Tio Julius no Bairro</h1>
    <p>O tio anda pela cidade e responde o chat da live com voz.</p>
    <label>@ do TikTok da live</label>
    <input id="in-user" placeholder="ex: animacaobarata" autocomplete="off">
    <label>ID da voz do Fish Audio <small>(opcional)</small></label>
    <input id="in-voz" placeholder="cole aqui o Model Id da voz" autocomplete="off">
    <button id="btn-live">CONECTAR NA LIVE</button>
    <button id="btn-teste">MODO TESTE (sem live)</button>
  </div>
</div>
<script src="/socket.io/socket.io.js" onerror="window.io=undefined"></script>
<script src="jogo.bundle.js"></script>
</body>
</html>
